{% extends 'base.html' %}
{% block title %}Log in - Stock Trading System{% endblock %}
{% block content %}
<div class="card auth-card">
  <h2>Log in</h2>
  {% if error %}
    {% include '_error_box.html' %}
  {% endif %}
  <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username }}" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="auth-alt">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div>
{% endblock %}
